<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Presensi Pegawai</title>
    <!-- Tailwind CSS untuk membuat tampilan rapi dan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pustaka Supabase untuk HTML -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-2">📍 Portal Presensi</h1>
        <p class="text-sm text-center text-gray-500 mb-6">Cabdis Wilayah IV</p>

        <!-- Form Pencarian NIP -->
        <div id="login-section">
            <label class="block text-sm font-medium text-gray-700 mb-2">Masukkan NIP Anda:</label>
            <input type="text" id="nip-input" placeholder="Contoh: 198001012005011001" 
                   class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500 mb-4">
            <button onclick="cekPegawai()" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">
                Cari Data Pegawai
            </button>
        </div>

        <!-- Area Hasil Pencarian (Disembunyikan awalnya) -->
        <div id="absen-section" class="hidden mt-6">
            <div id="info-pegawai" class="p-4 bg-blue-50 rounded-lg text-sm mb-4 border border-blue-200"></div>
            <p id="status-pesan" class="text-center text-sm font-semibold text-green-600 mt-4"></p>
            <button onclick="lokasiAwal()" class="mt-4 w-full bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-lg hover:bg-gray-300 transition">
                ⬅️ Kembali Cari NIP Lain
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // GANTI BAGIAN INI DENGAN DATA DARI NOTEPAD ANDA
        // ==========================================
        const SUPABASE_URL = 'sb_publishable_tohtgJVbt1WyahJ5nDuQ4Q_3mgFkEZX';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1bHZ3dW11aGx6emVod2tpYnVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2ODYzNzMsImV4cCI6MjEwNjI2MjM3M30.-zFMHuGQRiPsBEsgOINZI4r6tEeUTFgnMcX4CN85t8Y';

        // Menghubungkan ke Database Supabase
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cekPegawai() {
            const nip = document.getElementById('nip-input').value.trim();
            if (!nip) {
                alert("Silakan masukkan NIP terlebih dahulu!");
                return;
            }

            // Ubah teks tombol saat mencari
            const btn = document.querySelector('button');
            btn.innerText = "Mencari data...";
            
            // Ambil data dari tabel 'pegawai' di Supabase
            const { data, error } = await supabase
                .from('pegawai')
                .select('nip, name, school_name')
                .eq('nip', nip)
                .single();

            btn.innerText = "Cari Data Pegawai";

            if (error || !data) {
                alert("Pegawai dengan NIP tersebut tidak ditemukan!");
                return;
            }

            // Jika berhasil, sembunyikan input dan tampilkan nama pegawai
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('absen-section').classList.remove('hidden');
            
            document.getElementById('info-pegawai').innerHTML = `
                👤 <strong>Nama:</strong> ${data.name} <br><br>
                🏫 <strong>Unit Kerja:</strong> ${data.school_name}
            `;
            
            document.getElementById('status-pesan').innerText = "✅ Koneksi ke database berhasil! Fitur GPS dan Kamera akan kita tambahkan di langkah selanjutnya.";
        }

        function lokasiAwal() {
            document.getElementById('absen-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('nip-input').value = '';
        }
    </script>
</body>
</html>
